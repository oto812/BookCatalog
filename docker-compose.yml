services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: bookcatalog
    volumes:
      - bookcatalog-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bookcatalog"]
      interval: 5s
      timeout: 3s
      retries: 10

  bookcatalog.api:
    image: ${DOCKER_REGISTRY-}bookcatalogapi
    build:
      context: .
      dockerfile: BookCatalog.Api/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: 8080
      ConnectionStrings__BookCatalog: "Host=db;Port=5432;Database=bookcatalog;Username=postgres;Password=${POSTGRES_PASSWORD}"
    ports:
      - "8080:8080"
    stop_grace_period: 10s

volumes:
  bookcatalog-data: