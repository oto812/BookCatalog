name: CI

on: 
  pull_request:
  push: 
    branches: [main]

jobs: 
  tests:   
    runs-on: ubuntu-latest
    steps: 
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Unit tests
        run: dotnet test BookCatalog.UnitTests/BookCatalog.UnitTests.csproj
      - name: Integration tests
        run: dotnet test BookCatalog.IntegrationTests/BookCatalog.IntegrationTests.csproj
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t bookcatalog-api:${{ github.sha }} -f BookCatalog.Api/Dockerfile .
      - name: Save image to a file
        run: docker save bookcatalog-api:${{ github.sha }} | gzip > image.tar.gz
      - uses: actions/upload-artifact@v4
        with: 
          name: image
          path: image.tar.gz
          retention-days: 7

  smoke-test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: 
          name: image
      - name: Load the image
        run: |
           docker load -i image.tar.gz
           docker tag bookcatalog-api:${{ github.sha }} bookcatalogapi
      - name: Start API and postgres
        run: docker compose up -d --no-build --wait --wait-timeout 120
        env: 
          POSTGRES_PASSWORD: ci-throwaway
      - name: Call the running image
        run: |
          curl -fsS http://localhost:8080/health/ready
          curl -fsS "http://localhost:8080/api/books?page=1&pageSize=1"
      - name: Show logs when something failed
        if: failure()
        run: docker compose logs
  publish:
    needs: [tests, smoke-test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      id-token: write      # lets this job ask GitHub for a signed OIDC token
      contents: read
    env:
      IMAGE: ${{ vars.ACR_NAME }}.azurecr.io/bookcatalog-api:${{ github.sha }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: image
      - name: Load the tested image
        run: docker load -i image.tar.gz
      - uses: azure/login@v2           # trades GitHub's token for an Azure token - no password
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Push to ACR
        run: |
          az acr login --name ${{ vars.ACR_NAME }}
          docker tag bookcatalog-api:${{ github.sha }} $IMAGE
          docker push $IMAGE
      - name: Record the digest
        run: |
          echo "Pushed: $(docker inspect --format '{{index .RepoDigests 0}}' $IMAGE)" >> $GITHUB_STEP_SUMMARY 
  deploy:
    needs: publish
    runs-on: ubuntu-latest
    concurrency: production
    permissions:
      id-token: write
      contents: read
    env: 
      RG: ${{ vars.RESOURCE_GROUP }}
      APP: ca-bookcatalog-api
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars. AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy the image
        run: az deployment group create -g "$RG" -f infra/app.bicep -p imageTag= ${{ github.sha }}
      - name: Wait until the new revision is the one serving
        run: |
          for i in $(seq 1 30); do
            latest=$(az containerapp show -g "$RG" -n "$APP" --query properties.latestRevisionName -o tsv)
            ready=$(az containerapp show -g "$RG" -n "$APP" --query properties.latestReadyRevisionName -o tsv)
            echo "latest=$latest ready=$ready"
            if [ "$latest" = "$ready" ]; then exit 0; fi
            sleep 10
          done
          echo "::error::$latest never became ready - traffic is still on $ready"
          exit 1
      - name: Call the deployed app
        run: |
          fqdn=$(az containerapp show -g "$RG" -n "$APP" --query properties.configuration.ingress.fqdn -o tsv)
          curl -fsS --retry 5 --retry-delay 10 --retry-all-errors "https://$fqdn/health/ready"
  
